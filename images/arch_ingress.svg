<svg width="1360" height="980" viewBox="0 0 680 490" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
    <title>Arquitetura com ingress validando JWT via JWKS</title>
    <desc>Clientes (User, Mobile App, Web App) e um External App enviam requisições ao Ingress, que valida a assinatura do JWT usando as chaves publicadas pelo Identity Provider via JWKS. O Ingress encaminha as requisições já autenticadas para o Monolith ou para o grupo de Microservices, cada um com seu próprio banco de dados.</desc>

    <rect x="0" y="0" width="680" height="490" fill="#FAFAFA"/>

    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="#263238" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
        <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="#0FA98E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
    </defs>

    <rect x="40" y="40" width="250" height="100" rx="12" fill="none" stroke="#263238" stroke-width="0.75" stroke-dasharray="4 4"/>
    <text x="55" y="55" font-size="11" fill="#263238">Clients</text>
    <rect x="55" y="80" width="60" height="40" rx="8" fill="#FAFAFA" stroke="#263238" stroke-width="0.75"/>
    <text x="85" y="104" font-size="11" fill="#263238" text-anchor="middle">User</text>
    <rect x="125" y="80" width="70" height="40" rx="8" fill="#FAFAFA" stroke="#263238" stroke-width="0.75"/>
    <text x="160" y="104" font-size="11" fill="#263238" text-anchor="middle">Mobile app</text>
    <rect x="205" y="80" width="60" height="40" rx="8" fill="#FAFAFA" stroke="#263238" stroke-width="0.75"/>
    <text x="235" y="104" font-size="11" fill="#263238" text-anchor="middle">Web app</text>

    <rect x="310" y="80" width="150" height="40" rx="8" fill="#FAFAFA" stroke="#263238" stroke-width="0.75"/>
    <text x="385" y="104" font-size="12" font-weight="700" fill="#263238" text-anchor="middle">External app</text>

    <rect x="500" y="40" width="130" height="100" rx="12" fill="none" stroke="#263238" stroke-width="0.75" stroke-dasharray="4 4"/>
    <text x="515" y="55" font-size="11" fill="#263238">Identity</text>
    <rect x="510" y="80" width="110" height="45" rx="8" fill="#0FA98E" stroke="#0FA98E" stroke-width="0.75"/>
    <text x="565" y="107" font-size="12" font-weight="700" fill="#FAFAFA" text-anchor="middle">Auth server</text>

    <path d="M165 140 L165 180 L300 180 L300 210" fill="none" stroke="#263238" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M385 120 L385 180 L420 180 L420 210" fill="none" stroke="#263238" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M565 140 L565 180 L450 180 L450 210" fill="none" stroke="#0FA98E" stroke-width="1" marker-end="url(#arrow-accent)"/>
    <text x="500" y="174" font-size="11" fill="#263238" text-anchor="middle">JWKS</text>

    <rect x="270" y="210" width="200" height="60" rx="8" fill="#0FA98E" stroke="#0FA98E" stroke-width="0.75"/>
    <text x="370" y="233" font-size="14" font-weight="700" fill="#FAFAFA" text-anchor="middle">Ingress</text>
    <text x="370" y="251" font-size="11" fill="#FAFAFA" text-anchor="middle">Valida JWT via JWKS</text>

    <path d="M370 270 L370 285 L190 285 L190 300" fill="none" stroke="#0FA98E" stroke-width="1" marker-end="url(#arrow-accent)"/>
    <path d="M370 270 L370 285 L490 285 L490 300" fill="none" stroke="#0FA98E" stroke-width="1" marker-end="url(#arrow-accent)"/>

    <rect x="60" y="300" width="260" height="150" rx="12" fill="none" stroke="#263238" stroke-width="0.75" stroke-dasharray="4 4"/>
    <text x="75" y="315" font-size="11" fill="#263238">Monolith</text>
    <rect x="90" y="335" width="200" height="48" rx="8" fill="#FAFAFA" stroke="#263238" stroke-width="0.75"/>
    <text x="190" y="356" font-size="12" font-weight="700" fill="#263238" text-anchor="middle">Backend monolith</text>
    <text x="190" y="373" font-size="10" fill="#263238" text-anchor="middle">Já recebe request autenticado</text>
    <rect x="140" y="400" width="100" height="36" rx="8" fill="#0D1B2A" stroke="#0D1B2A" stroke-width="0.75"/>
    <text x="190" y="422" font-size="11" fill="#FAFAFA" text-anchor="middle">Monolith DB</text>
    <line x1="190" y1="383" x2="190" y2="400" stroke="#263238" stroke-width="1" marker-end="url(#arrow)"/>

    <rect x="360" y="300" width="260" height="150" rx="12" fill="none" stroke="#263238" stroke-width="0.75" stroke-dasharray="4 4"/>
    <text x="375" y="315" font-size="11" fill="#263238">Microservices</text>
    <rect x="390" y="335" width="200" height="48" rx="8" fill="#FAFAFA" stroke="#263238" stroke-width="0.75"/>
    <text x="490" y="356" font-size="12" font-weight="700" fill="#263238" text-anchor="middle">Microservices</text>
    <text x="490" y="373" font-size="10" fill="#263238" text-anchor="middle">Billing, docs, notif, analytics</text>
    <rect x="440" y="400" width="100" height="36" rx="8" fill="#0D1B2A" stroke="#0D1B2A" stroke-width="0.75"/>
    <text x="490" y="422" font-size="11" fill="#FAFAFA" text-anchor="middle">Service DBs</text>
    <line x1="490" y1="383" x2="490" y2="400" stroke="#263238" stroke-width="1" marker-end="url(#arrow)"/>
</svg>