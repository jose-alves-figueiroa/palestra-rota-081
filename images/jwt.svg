<svg viewBox="0 0 1600 1080" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1600" height="1080" rx="34" fill="#ffffff" stroke="#e7ebee" stroke-width="2"/>

  <text x="800" y="100" text-anchor="middle" font-size="42" font-weight="700" fill="#0d9488">Estrutura de um JSON Web Token (JWT)</text>

  <!-- Token example box -->
  <rect x="110" y="150" width="1380" height="160" rx="18" fill="#f3faf9"/>
  <text x="146" y="200" font-size="21" font-weight="700" fill="#1f2937">Exemplo de JWT</text>
  <text x="146" y="238" font-family="Courier New, monospace" font-size="20" fill="#0f9488">eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnR</text>
  <text x="146" y="272" font-family="Courier New, monospace" font-size="20" fill="#0f9488">cnVlLCJpYXQiOjE1MTYyMzkwMjIsImV4cCI6MTUxNjI0MjYyMn0.KMUFsIDTnFmyG3nMiGM6H9FNFUROf3wh7SmqJp-QV30</text>

  <!-- Middle bar -->
  <rect x="110" y="340" width="1380" height="155" rx="18" fill="#f3faf9"/>

  <!-- Header icon -->
  <rect x="196" y="378" width="68" height="68" rx="14" fill="#def5f1"/>
  <text x="230" y="424" text-anchor="middle" font-size="30" font-weight="700" fill="#0f9488">{ }</text>
  <text x="300" y="425" font-size="27" font-weight="700" fill="#1f2937">HEADER</text>

  <circle cx="545" cy="417" r="6" fill="#0f9488"/>

  <!-- Payload icon -->
  <rect x="666" y="378" width="68" height="68" rx="14" fill="#def5f1"/>
  <path d="M689 392 h22 l8 8 v26 h-30 z" fill="none" stroke="#0f9488" stroke-width="3"/>
  <line x1="694" y1="410" x2="716" y2="410" stroke="#0f9488" stroke-width="3"/>
  <line x1="694" y1="418" x2="716" y2="418" stroke="#0f9488" stroke-width="3"/>
  <text x="770" y="425" font-size="27" font-weight="700" fill="#1f2937">PAYLOAD</text>

  <circle cx="1023" cy="417" r="6" fill="#0f9488"/>

  <!-- Signature icon -->
  <rect x="1148" y="378" width="68" height="68" rx="14" fill="#def5f1"/>
  <path d="M1182 391 l17 7 v14 c0 12 -8 19 -17 22 c-9 -3 -17 -10 -17 -22 v-14 z" fill="none" stroke="#0f9488" stroke-width="3"/>
  <polyline points="1174,410 1180,417 1191,404" fill="none" stroke="#0f9488" stroke-width="3"/>
  <text x="1252" y="425" font-size="27" font-weight="700" fill="#1f2937">SIGNATURE</text>

  <!-- Arrows -->
  <line x1="310" y1="495" x2="310" y2="580" stroke="#0f9488" stroke-width="3"/>
  <polygon points="310,590 302,576 318,576" fill="#0f9488"/>

  <line x1="775" y1="495" x2="775" y2="580" stroke="#0f9488" stroke-width="3"/>
  <polygon points="775,590 767,576 783,576" fill="#0f9488"/>

  <line x1="1265" y1="495" x2="1265" y2="580" stroke="#0f9488" stroke-width="3"/>
  <polygon points="1265,590 1257,576 1273,576" fill="#0f9488"/>

  <!-- Header code box -->
  <rect x="110" y="595" width="410" height="340" rx="18" fill="#ffffff" stroke="#eef1f3" stroke-width="2"/>
  <text x="146" y="645" font-size="19" font-weight="700" fill="#0f9488">Exemplo</text>
  <g font-family="Courier New, monospace" font-size="22" fill="#1f2937">
    <text x="146" y="690">{</text>
    <text x="180" y="726">"alg": <tspan fill="#0f9488">"HS256"</tspan>,</text>
    <text x="180" y="762">"typ": <tspan fill="#0f9488">"JWT"</tspan></text>
    <text x="146" y="798">}</text>
  </g>

  <!-- Payload code box (taller, exp added) -->
  <rect x="565" y="595" width="420" height="400" rx="18" fill="#ffffff" stroke="#eef1f3" stroke-width="2"/>
  <text x="601" y="645" font-size="19" font-weight="700" fill="#0f9488">Exemplo</text>
  <g font-family="Courier New, monospace" font-size="22" fill="#1f2937">
    <text x="601" y="690">{</text>
    <text x="635" y="726">"sub": <tspan fill="#0f9488">"1234567890"</tspan>,</text>
    <text x="635" y="762">"name": <tspan fill="#0f9488">"John Doe"</tspan>,</text>
    <text x="635" y="798">"admin": <tspan fill="#0f9488">true</tspan>,</text>
    <text x="635" y="834">"iat": <tspan fill="#0f9488">1516239022</tspan>,</text>
    <text x="635" y="870">"exp": <tspan fill="#0f9488">1516242622</tspan></text>
    <text x="601" y="906">}</text>
  </g>

  <!-- Signature code box -->
  <rect x="1040" y="595" width="450" height="340" rx="18" fill="#ffffff" stroke="#eef1f3" stroke-width="2"/>
  <text x="1076" y="645" font-size="19" font-weight="700" fill="#0f9488">Exemplo</text>
  <g font-family="Courier New, monospace" font-size="22" fill="#1f2937">
    <text x="1076" y="690">Base64URLSafe(</text>
    <text x="1110" y="726">HMACSHA256(</text>
    <text x="1144" y="762">header.payload,</text>
    <text x="1144" y="798">&lt;secret key&gt;</text>
    <text x="1110" y="834">))</text>
    <text x="1076" y="870">)</text>
  </g>
</svg>
